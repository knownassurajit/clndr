<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="320"
  height="360"
  viewBox="0 0 320 360"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background (optional, can be removed) -->
  <rect width="100%" height="100%" fill="#F9F9F9"/>

  <!-- Icon Group -->
  <g transform="translate(160 120)">

    <!-- Top -->
    <rect x="-15" y="-105" width="30" height="30"
          fill="none" stroke="#333333" stroke-width="4"
          transform="rotate(45)"/>

    <!-- Top Right -->
    <rect x="35" y="-75" width="30" height="30"
          fill="none" stroke="#333333" stroke-width="4"
          transform="rotate(45)"/>

    <!-- Bottom Right -->
    <rect x="35" y="15" width="30" height="30"
          fill="none" stroke="#333333" stroke-width="4"
          transform="rotate(45)"/>

    <!-- Bottom -->
    <rect x="-15" y="45" width="30" height="30"
          fill="none" stroke="#333333" stroke-width="4"
          transform="rotate(45)"/>

    <!-- Bottom Left -->
    <rect x="-65" y="15" width="30" height="30"
          fill="none" stroke="#333333" stroke-width="4"
          transform="rotate(45)"/>

    <!-- Top Left -->
    <rect x="-65" y="-75" width="30" height="30"
          fill="none" stroke="#333333" stroke-width="4"
          transform="rotate(45)"/>

    <!-- Highlighted "Now" square -->
    <rect x="-15" y="-15" width="30" height="30"
          fill="#E69138"/>
  </g>

  <!-- Brand Text -->
  <text
    x="160"
    y="300"
    text-anchor="middle"
    font-family="
      Montserrat,
      Poppins,
      Avenir,
      Futura,
      'Century Gothic',
      sans-serif
    "
    font-size="48"
    font-weight="600"
    letter-spacing="6"
    fill="#333333"
  >
    CLNDR
  </text>

</svg>