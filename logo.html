<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CLNDR Logo</title>

    <!-- Geometric Font (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <svg width="320" height="360" viewBox="0 0 320 360" xmlns="http://www.w3.org/2000/svg">

        <!-- Icon Group -->
        <g transform="translate(160 120)">

            <!-- Outlined squares -->
            <rect width="30" height="30" x="-15" y="-105" fill="none" stroke="#333" stroke-width="4"
                transform="rotate(45)" />

            <rect width="30" height="30" x="35" y="-75" fill="none" stroke="#333" stroke-width="4"
                transform="rotate(45)" />

            <rect width="30" height="30" x="35" y="15" fill="none" stroke="#333" stroke-width="4"
                transform="rotate(45)" />

            <rect width="30" height="30" x="-15" y="45" fill="none" stroke="#333" stroke-width="4"
                transform="rotate(45)" />

            <rect width="30" height="30" x="-65" y="15" fill="none" stroke="#333" stroke-width="4"
                transform="rotate(45)" />

            <rect width="30" height="30" x="-65" y="-75" fill="none" stroke="#333" stroke-width="4"
                transform="rotate(45)" />

            <!-- Highlighted "Now" square -->
            <rect x="-15" y="-15" width="30" height="30" fill="#E69138" />
        </g>

        <!-- Text -->
        <text x="160" y="300" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="48" font-weight="600"
            letter-spacing="6" fill="#333">
            CLNDR
        </text>

    </svg>

</body>

</html>
