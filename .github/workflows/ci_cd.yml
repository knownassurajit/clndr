name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Pure-JVM datetime tests
        run: ./gradlew :core:datetime:test --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: github.ref == 'refs/heads/develop' && success()
        uses: actions/upload-artifact@v4
        with:
          name: clndr-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Release Info
        id: release_info
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "RELEASE_CHANNEL=stable-final" >> $GITHUB_ENV
            echo "TAG_NAME=v$VERSION_NAME" >> $GITHUB_ENV
            echo "RELEASE_NAME=Stable Release v$VERSION_NAME" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
            echo "MAKE_LATEST=true" >> $GITHUB_ENV
            echo "RELEASE_SUMMARY=Stable final build produced from the master branch." >> $GITHUB_ENV
          else
            echo "RELEASE_CHANNEL=pre-release-debug" >> $GITHUB_ENV
            echo "TAG_NAME=v$VERSION_NAME-dev.${{ github.run_number }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Pre-release Debug v$VERSION_NAME-dev.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "MAKE_LATEST=false" >> $GITHUB_ENV
            echo "RELEASE_SUMMARY=Pre-release debug build produced from the develop branch for validation and testing." >> $GITHUB_ENV
          fi

      - name: Generate Release Body
        run: |
          cat > release_body.md <<EOF
          ### Release Summary
          - **Release Channel:** $RELEASE_CHANNEL
          - **Version:** v$VERSION_NAME
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** $SHORT_SHA
          - **Commit Message:** $(git log -1 --pretty=format:'%s')
          - **Build Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Artifacts:** Debug APK on develop, Debug APK + Release APK + AAB on master

          $RELEASE_SUMMARY

          ### What Changed
          $(git log --pretty=format:'- %h %s (%an, %ad)' --date=short -n 15 --no-merges)

          ### Notes
          - Pre-release builds are intended for validation on the develop branch.
          - Stable builds are published from the master branch for final distribution.
          EOF

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No KEYSTORE_B64 secret — release bundle will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Build Android Artifacts
        env:
          CLNDR_STORE_FILE: ${{ github.workspace }}/keystore.jks
          CLNDR_STORE_PASSWORD: ${{ secrets.CLNDR_STORE_PASSWORD }}
          CLNDR_KEY_ALIAS: ${{ secrets.CLNDR_KEY_ALIAS }}
          CLNDR_KEY_PASSWORD: ${{ secrets.CLNDR_KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
