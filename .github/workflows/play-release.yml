name: Play Console Release

on:
  push:
    branches:
      - master

concurrency:
  group: play-release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Release & Publish to Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Version
        id: version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | awk '{print $3}')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "shortSha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Create Release Branch
        run: |
          BRANCH_NAME="release/clndr/${{ steps.version.outputs.versionName }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, checking it out"
            git checkout "$BRANCH_NAME"
          else
            echo "Creating new release branch $BRANCH_NAME"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Build Android App Bundle
        env:
          CLNDR_STORE_FILE: ${{ github.workspace }}/keystore.jks
          CLNDR_STORE_PASSWORD: ${{ secrets.CLNDR_STORE_PASSWORD }}
          CLNDR_KEY_ALIAS: ${{ secrets.CLNDR_KEY_ALIAS }}
          CLNDR_KEY_PASSWORD: ${{ secrets.CLNDR_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Generate Release Notes
        run: |
          mkdir -p release_notes/en-US
          cat > release_notes/en-US/default.txt <<EOF
          Source:
          branch=release/clndr/${{ steps.version.outputs.versionName }}
          commit=${{ github.sha }}
          workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Publish to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_JSON }}
          packageName: com.knownassurajit.clndr_widget.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: release_notes
          releaseName: clndr-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.shortSha }}
