name: CI/CD

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_version:
        description: 'Optional rollback version tag (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions: read-all

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: eclipse-temurin:17-jdk-jammy
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y unzip curl

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Legacy SDK package "tools" is gone; requesting it makes sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Pure-JVM datetime tests
        run: ./gradlew :core:datetime:test --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: github.ref == 'refs/heads/develop' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clndr-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: detekt-report
          path: build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  debug-release:
    name: Create Pre-release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Legacy SDK package "tools" is gone; requesting it makes sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Determine Release Info
        id: release_info
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NAME-dev.${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Pre-release Debug v$VERSION_NAME-dev.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Generate Release Body
        run: |
          cat > release_body.md <<EOF
          ### Release Summary
          - **Release Channel:** pre-release-debug
          - **Version:** v$VERSION_NAME
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** $SHORT_SHA
          - **Commit Message:** $(git log -1 --pretty=format:'%s')
          - **Build Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - **Workflow Run:** [#${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          Pre-release debug build from develop for validation and testing.

          ### What Changed
          $(git log --pretty=format:'- %h %s (%an, %ad)' --date=short -n 15 --no-merges)
          EOF

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No KEYSTORE_B64 secret — debug APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Build debug APK
        env:
          CLNDR_STORE_FILE: ${{ github.workspace }}/keystore.jks
          CLNDR_STORE_PASSWORD: ${{ secrets.CLNDR_STORE_PASSWORD }}
          CLNDR_KEY_ALIAS: ${{ secrets.CLNDR_KEY_ALIAS }}
          CLNDR_KEY_PASSWORD: ${{ secrets.CLNDR_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-summary:
    name: PR summary
    needs: test
    if: always() && github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: eclipse-temurin:17-jdk-jammy
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y unzip curl

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Legacy SDK package "tools" is gone; requesting it makes sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Run checks and capture results
        id: checks
        continue-on-error: true
        run: |
          set +e

          run_step() {
            local name="$1"; shift
            local outfile="$1"; shift
            "$@" > "$outfile" 2>&1
            local status=$?
            if [ "$status" -eq 0 ]; then
              echo "${name}_STATUS=pass" >> "$GITHUB_ENV"
            else
              echo "${name}_STATUS=fail" >> "$GITHUB_ENV"
            fi
            return 0
          }

          run_step DETEKT detekt.log ./gradlew detekt --no-daemon
          run_step LINT lint.log ./gradlew lintDebug --no-daemon
          run_step UNIT_TEST unittest.log ./gradlew testDebugUnitTest --no-daemon
          run_step DATETIME_TEST datetime.log ./gradlew :core:datetime:test --no-daemon

          DETEKT_ISSUES=$(grep -ohE '[0-9]+ weighted issues' detekt.log | tail -n 1 | awk '{print $1}')
          echo "DETEKT_ISSUES=${DETEKT_ISSUES:-0}" >> "$GITHUB_ENV"

          UNIT_TESTS_RUN=$(grep -ohE '[0-9]+ tests completed' unittest.log | tail -n 1 | awk '{print $1}')
          echo "UNIT_TESTS_RUN=${UNIT_TESTS_RUN:-unknown}" >> "$GITHUB_ENV"

      - name: Determine version delta
        id: version_delta
        run: |
          CURRENT_VERSION=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          LAST_STABLE_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -vE '\-dev\.' | head -n 1)
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          if [ -n "$LAST_STABLE_TAG" ]; then
            echo "LAST_STABLE_TAG=$LAST_STABLE_TAG" >> "$GITHUB_ENV"
            COMMITS_SINCE=$(git rev-list "${LAST_STABLE_TAG}..HEAD" --count 2>/dev/null || echo "unknown")
            echo "COMMITS_SINCE=$COMMITS_SINCE" >> "$GITHUB_ENV"
          else
            echo "LAST_STABLE_TAG=(none found)" >> "$GITHUB_ENV"
            echo "COMMITS_SINCE=unknown" >> "$GITHUB_ENV"
          fi

      - name: Generate changelog preview
        run: |
          git log --pretty=format:'- %h %s (%an, %ad)' --date=short -n 20 --no-merges > changelog_preview.txt || true

      - name: Build summary
        run: |
          {
            echo "## PR Summary: develop -> ${{ github.base_ref }}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Detekt | ${DETEKT_STATUS:-unknown} (${DETEKT_ISSUES:-0} weighted issues) |"
            echo "| Android Lint | ${LINT_STATUS:-unknown} |"
            echo "| Unit tests (testDebugUnitTest) | ${UNIT_TEST_STATUS:-unknown} |"
            echo "| Pure-JVM datetime tests | ${DATETIME_TEST_STATUS:-unknown} |"
            echo
            echo "### Version delta"
            echo "- Current \`versionName\`: \`$CURRENT_VERSION\`"
            echo "- Last stable tag: \`$LAST_STABLE_TAG\`"
            echo "- Commits since last stable release: $COMMITS_SINCE"
            echo
            echo "### Changelog preview (last 20 commits)"
            echo '```'
            cat changelog_preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "## PR Summary: develop -> ${{ github.base_ref }}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Detekt | ${DETEKT_STATUS:-unknown} (${DETEKT_ISSUES:-0} weighted issues) |"
            echo "| Android Lint | ${LINT_STATUS:-unknown} |"
            echo "| Unit tests (testDebugUnitTest) | ${UNIT_TEST_STATUS:-unknown} |"
            echo "| Pure-JVM datetime tests | ${DATETIME_TEST_STATUS:-unknown} |"
            echo
            echo "### Version delta"
            echo "- Current \`versionName\`: \`$CURRENT_VERSION\`"
            echo "- Last stable tag: \`$LAST_STABLE_TAG\`"
            echo "- Commits since last stable release: $COMMITS_SINCE"
            echo
            echo "### Changelog preview (last 20 commits)"
            echo '```'
            cat changelog_preview.txt
            echo '```'
          } > pr_comment_body.md

      - name: Post PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment_body.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## PR Summary: develop -> ';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if any check failed
        if: env.DETEKT_STATUS == 'fail' || env.LINT_STATUS == 'fail' || env.UNIT_TEST_STATUS == 'fail' || env.DATETIME_TEST_STATUS == 'fail'
        run: |
          echo "One or more checks failed. See summary above."
          exit 1

  stable-release:
    name: Prepare Release, Publish GitHub & Play Console
    needs: test
    # Production branch is master. main is accepted so a rename still publishes.
    # Manual rollback must be dispatched from that same branch.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      CLNDR_APPLICATION_ID: com.knownassurajit.clndr_widget.app
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Checkout rollback tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_version != ''
        env:
          ROLLBACK_VERSION: ${{ github.event.inputs.rollback_version }}
        run: git checkout "$ROLLBACK_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Legacy SDK package "tools" is gone; requesting it makes sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Detekt, lint, unit tests
        run: ./gradlew detekt lintDebug testDebugUnitTest :core:datetime:test --no-daemon

      - name: Rollback version code
        id: rollback
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_version != ''
        run: |
          # Absolute code so a rebuilt older tag is still newer than the live Play release.
          # yyyyMMddHH stays under Play's 2100000000 cap.
          code=$(date -u +'%Y%m%d%H')
          echo "versionCode=$code" >> "$GITHUB_OUTPUT"
          echo "Rollback build will use versionCode=$code"

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          CLNDR_STORE_PASSWORD: ${{ secrets.CLNDR_STORE_PASSWORD }}
          CLNDR_KEY_ALIAS: ${{ secrets.CLNDR_KEY_ALIAS }}
          CLNDR_KEY_PASSWORD: ${{ secrets.CLNDR_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=(KEYSTORE_B64)
          [ -z "$CLNDR_STORE_PASSWORD" ] && missing+=(CLNDR_STORE_PASSWORD)
          [ -z "$CLNDR_KEY_ALIAS" ] && missing+=(CLNDR_KEY_ALIAS)
          [ -z "$CLNDR_KEY_PASSWORD" ] && missing+=(CLNDR_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Signed release AAB requires repository secrets: ${missing[*]}. Values are not stored in the repo. See .github/README.md."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"
          if [ ! -s "$GITHUB_WORKSPACE/keystore.jks" ]; then
            echo "::error::KEYSTORE_B64 decoded to an empty keystore."
            exit 1
          fi
          chmod 600 "$GITHUB_WORKSPACE/keystore.jks"

      - name: Build signed release APK and AAB
        env:
          CLNDR_STORE_FILE: ${{ github.workspace }}/keystore.jks
          CLNDR_STORE_PASSWORD: ${{ secrets.CLNDR_STORE_PASSWORD }}
          CLNDR_KEY_ALIAS: ${{ secrets.CLNDR_KEY_ALIAS }}
          CLNDR_KEY_PASSWORD: ${{ secrets.CLNDR_KEY_PASSWORD }}
          CLNDR_REQUIRE_RELEASE_SIGNING: "true"
          CLNDR_VERSION_CODE_OFFSET: ${{ github.run_number }}
          CLNDR_VERSION_CODE: ${{ steps.rollback.outputs.versionCode }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify signed release AAB
        id: aab
        env:
          EXPECTED_APPLICATION_ID: ${{ env.CLNDR_APPLICATION_ID }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys

          expected = os.environ["EXPECTED_APPLICATION_ID"]
          bundle_dir = "app/build/outputs/bundle/release"
          meta_path = os.path.join(bundle_dir, "output-metadata.json")
          with open(meta_path, encoding="utf-8") as fh:
              meta = json.load(fh)
          app_id = meta.get("applicationId")
          if app_id != expected:
              print(f"::error::AAB applicationId is {app_id!r}; Play packageName must be {expected!r}.")
              sys.exit(1)
          elements = meta.get("elements") or []
          if len(elements) != 1:
              print(f"::error::Expected exactly one release AAB, found {len(elements)} in {meta_path}.")
              sys.exit(1)
          element = elements[0]
          output_file = element.get("outputFile") or ""
          aab_path = os.path.join(bundle_dir, output_file)
          normalized = aab_path.replace("\\", "/")
          if not normalized.startswith("app/build/outputs/bundle/release/") or not normalized.endswith(".aab"):
              print(f"::error::Unexpected release AAB path {aab_path!r}.")
              sys.exit(1)
          if not os.path.isfile(aab_path):
              print(f"::error::AAB listed in output-metadata.json was not found at {aab_path}.")
              sys.exit(1)
          verify = subprocess.run(
              ["jarsigner", "-verify", aab_path],
              capture_output=True,
              text=True,
          )
          verify_text = f"{verify.stdout}\n{verify.stderr}".lower()
          # -strict treats a self-signed Play upload key as a failure.
          # An unsigned jar can also exit 0, so require the "jar verified" line.
          if verify.returncode != 0 or "jar verified" not in verify_text or "jar is unsigned" in verify_text:
              sys.stdout.write(verify.stdout)
              sys.stderr.write(verify.stderr)
              print("::error::Release AAB is not signed. Check KEYSTORE_B64, CLNDR_STORE_PASSWORD, CLNDR_KEY_ALIAS, and CLNDR_KEY_PASSWORD.")
              sys.exit(1)

          apk_dir = "app/build/outputs/apk/release"
          with open(os.path.join(apk_dir, "output-metadata.json"), encoding="utf-8") as fh:
              apk_meta = json.load(fh)
          apk_elements = apk_meta.get("elements") or []
          if len(apk_elements) != 1:
              print(f"::error::Expected exactly one release APK, found {len(apk_elements)}.")
              sys.exit(1)
          if apk_meta.get("applicationId") != expected:
              print(f"::error::Release APK applicationId is {apk_meta.get('applicationId')!r}; expected {expected!r}.")
              sys.exit(1)
          apk_path = os.path.join(apk_dir, apk_elements[0]["outputFile"])
          if not os.path.isfile(apk_path):
              print(f"::error::Release APK was not found at {apk_path}.")
              sys.exit(1)

          version_name = str(element.get("versionName") or "")
          version_code = str(element.get("versionCode") or "")
          if not version_name or not version_code.isdigit():
              print("::error::output-metadata.json is missing versionName or versionCode.")
              sys.exit(1)
          code_int = int(version_code)
          if code_int <= 0 or code_int > 2_100_000_000:
              print(f"::error::versionCode {code_int} is outside Play's 1..2100000000 range.")
              sys.exit(1)

          mapping = "app/build/outputs/mapping/release/mapping.txt"
          if not os.path.isfile(mapping):
              print("::warning::Proguard mapping.txt was not produced; Play will not receive a deobfuscation file.")
              mapping = ""

          out_dir = "build/ci-release"
          os.makedirs(out_dir, exist_ok=True)
          shutil.copyfile(aab_path, os.path.join(out_dir, f"clndr-{version_name}.aab"))
          shutil.copyfile(apk_path, os.path.join(out_dir, f"clndr-{version_name}.apk"))
          if mapping:
              shutil.copyfile(mapping, os.path.join(out_dir, "mapping.txt"))

          short_sha = os.environ["GITHUB_SHA"][:7]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"path={aab_path}\n")
              fh.write(f"apk={apk_path}\n")
              fh.write(f"mapping={mapping}\n")
              fh.write(f"versionName={version_name}\n")
              fh.write(f"versionCode={version_code}\n")
              fh.write(f"applicationId={app_id}\n")
              fh.write(f"shortSha={short_sha}\n")
          print(f"Signed AAB {aab_path} applicationId={app_id} versionName={version_name} versionCode={version_code}")
          PY

      - name: Detect Play Console credentials
        id: play
        env:
          PLAY_CONSOLE_JSON: ${{ secrets.PLAY_CONSOLE_JSON }}
        run: |
          # Do not compare this secret in an `if:` expression. A multiline
          # service-account JSON makes that condition a permanent skip.
          if [ -z "$PLAY_CONSOLE_JSON" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Google Play"
              echo "PLAY_CONSOLE_JSON is not set, so this build was not uploaded."
              echo "Add that repository secret to publish the internal track. See .github/README.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PLAY_CONSOLE_JSON is not set. Signed AAB will not be uploaded to Google Play. See .github/README.md."
            exit 0
          fi
          dest="${RUNNER_TEMP}/play-service-account.json"
          umask 077
          printf '%s' "$PLAY_CONSOLE_JSON" > "$dest"
          chmod 600 "$dest"
          export PLAY_JSON_PATH="$dest"
          python3 - <<'PY'
          import json, os, sys
          path = os.environ["PLAY_JSON_PATH"]
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
          except json.JSONDecodeError:
              print("::error::PLAY_CONSOLE_JSON is not valid JSON. Paste the Play service-account key file itself, not a file path or a base64 blob.")
              sys.exit(1)
          if data.get("type") != "service_account" or not data.get("client_email") or not data.get("private_key"):
              print("::error::PLAY_CONSOLE_JSON must be a Google service account key with type, client_email, and private_key.")
              sys.exit(1)
          print("Play service account JSON parsed.")
          PY
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "json=$dest" >> "$GITHUB_OUTPUT"

      - name: Write Play release notes
        run: |
          mkdir -p release_notes
          # r0adkll/upload-google-play only reads whatsnew-<bcp47> with no extension.
          printf '%s\n' "clndr ${{ steps.aab.outputs.versionName }}" > release_notes/whatsnew-en-US
          chars=$(wc -c < release_notes/whatsnew-en-US)
          if [ "$chars" -gt 500 ]; then
            echo "::error::Play release notes are ${chars} bytes; the limit is 500."
            exit 1
          fi

      - name: Publish to Google Play (internal track)
        if: steps.play.outputs.present == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJson: ${{ steps.play.outputs.json }}
          packageName: ${{ steps.aab.outputs.applicationId }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: completed
          whatsNewDirectory: release_notes
          releaseName: clndr-${{ steps.aab.outputs.versionName }}-${{ steps.aab.outputs.shortSha }}
          mappingFile: ${{ steps.aab.outputs.mapping }}

      - name: Point rollback branch at this SHA
        if: always() && steps.aab.outcome == 'success'
        run: |
          BRANCH_NAME="release/clndr/${{ steps.aab.outputs.versionName }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git branch -f "$BRANCH_NAME" HEAD
          git push origin "$BRANCH_NAME" || git push origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Publish GitHub Release
        if: always() && steps.aab.outcome == 'success'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: v${{ steps.aab.outputs.versionName }}
          name: "clndr v${{ steps.aab.outputs.versionName }}"
          body: |
            ### Release Summary
            - **App:** clndr
            - **Package:** ${{ steps.aab.outputs.applicationId }}
            - **Version name:** ${{ steps.aab.outputs.versionName }}
            - **Version code:** ${{ steps.aab.outputs.versionCode }}
            - **Commit:** ${{ steps.aab.outputs.shortSha }}
            - **Play track:** internal
            - **Release branch:** `release/clndr/${{ steps.aab.outputs.versionName }}`
          draft: false
          prerelease: false
          files: build/ci-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed release artifacts
        if: always() && steps.aab.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clndr-release-${{ steps.aab.outputs.versionName }}-${{ steps.aab.outputs.versionCode }}
          path: build/ci-release/*
          if-no-files-found: error

      - name: Release summary
        if: always() && steps.aab.outcome == 'success'
        run: |
          {
            echo "### Signed release"
            echo "- Package: \`${{ steps.aab.outputs.applicationId }}\`"
            echo "- AAB: \`${{ steps.aab.outputs.path }}\`"
            echo "- versionName: \`${{ steps.aab.outputs.versionName }}\`"
            echo "- versionCode: \`${{ steps.aab.outputs.versionCode }}\`"
            echo "- Play track: \`internal\`"
            echo "- Play credential step: ${{ steps.play.outcome }}"
            if [ "${{ steps.play.outputs.present }}" = "true" ]; then
              echo "- Play upload: attempted for package \`${{ steps.aab.outputs.applicationId }}\`"
            elif [ "${{ steps.play.outcome }}" = "failure" ]; then
              echo "- Play upload: blocked because PLAY_CONSOLE_JSON was present but invalid"
            else
              echo "- Play upload: skipped because PLAY_CONSOLE_JSON is not set"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
        with:
          fail-on-severity: high
